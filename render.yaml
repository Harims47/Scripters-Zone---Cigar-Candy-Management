services:
  # ---------------------------------------------------------------------------
  # 1. BACKEND WEB SERVICE (Fastify + Prisma + Node.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: crackers-hub-backend
    runtime: node
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: crackers-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE
        value: 15m
      - key: REFRESH_TOKEN_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # ---------------------------------------------------------------------------
  # 2. FRONTEND STATIC SITE (React + Vite + TypeScript)
  # ---------------------------------------------------------------------------
  - type: web
    name: crackers-hub-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  # ---------------------------------------------------------------------------
  # 3. POSTGRESQL DATABASE (Render Managed PostgreSQL 16)
  # ---------------------------------------------------------------------------
  - name: crackers-hub-db
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: 16
