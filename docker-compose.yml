services:
  postgres:
    image: postgres:16-alpine
    container_name: crackers_hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crackers_hub
    ports:
      - "5432:5432"
    volumes:
      - crackers_postgres_data:/var/lib/postgresql/data

volumes:
  crackers_postgres_data:
